<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 292 82" fill="none">
  <defs>
    <linearGradient id="globeG" x1="10" y1="12" x2="68" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4da8f0"/>
      <stop offset="48%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1a3566"/>
    </linearGradient>
    <clipPath id="gc">
      <circle cx="39" cy="41" r="28"/>
    </clipPath>
  </defs>

  <!-- Globe outline -->
  <circle cx="39" cy="41" r="28" stroke="url(#globeG)" stroke-width="2"/>

  <!-- Latitude rings -->
  <ellipse cx="39" cy="26" rx="23" ry="6.5" stroke="url(#globeG)" stroke-width="1.5" clip-path="url(#gc)"/>
  <ellipse cx="39" cy="41" rx="28" ry="7.5" stroke="url(#globeG)" stroke-width="1.5" clip-path="url(#gc)"/>
  <ellipse cx="39" cy="56" rx="23" ry="6.5" stroke="url(#globeG)" stroke-width="1.5" clip-path="url(#gc)"/>

  <!-- Longitude curves -->
  <line x1="39" y1="13" x2="39" y2="69" stroke="url(#globeG)" stroke-width="1.5" clip-path="url(#gc)"/>
  <path d="M 39 13 C 19 21 17 61 39 69" stroke="url(#globeG)" stroke-width="1.5" fill="none" clip-path="url(#gc)"/>
  <path d="M 39 13 C 59 21 61 61 39 69" stroke="url(#globeG)" stroke-width="1.5" fill="none" clip-path="url(#gc)"/>

  <!-- Node dots -->
  <circle cx="39" cy="13" r="3.5" fill="url(#globeG)"/>
  <circle cx="39" cy="69" r="3.5" fill="url(#globeG)"/>
  <circle cx="11" cy="41" r="3.5" fill="url(#globeG)"/>
  <circle cx="67" cy="41" r="3.5" fill="url(#globeG)"/>
  <circle cx="26" cy="26" r="2.8" fill="url(#globeG)"/>
  <circle cx="52" cy="26" r="2.8" fill="url(#globeG)"/>
  <circle cx="26" cy="56" r="2.8" fill="url(#globeG)"/>
  <circle cx="52" cy="56" r="2.8" fill="url(#globeG)"/>

  <!-- Vertical divider -->
  <line x1="81" y1="14" x2="81" y2="68" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>

  <!-- ADSA wordmark -->
  <text x="95" y="44" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-weight="800" font-size="28" fill="white" letter-spacing="-0.5">ADSA</text>

  <!-- Asesoría Digital S.A. -->
  <text x="96" y="57" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-weight="500" font-size="9.5" fill="rgba(203,213,225,0.82)">Asesoría Digital S.A.</text>

  <!-- Tagline -->
  <text x="96" y="69" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-weight="400" font-size="8.5" fill="#06b6d4">Innovación y Soluciones Digitales</text>
</svg>
